<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Book</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div th:insert="~{fragment :: header}"></div><br>

<h3>Book:</h3>

<form th:action="@{/books}" method="post" th:object="${book}">
    <label for="title">Title:
        <input id="title" type="text" name="title" th:value="*{title}">
    </label><br>
    <label for="author">Author:
        <select id="author" name="authorId">
            <option th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:selected="${author.id == book.authorId}"
                    th:text="${author.fullName}">Author</option>
        </select>
    </label><br>
    <label for="genre">Genre:
        <select id="genre" name="genreId">
            <option th:each="genre : ${genres}"
                    th:value="${genre.id}"
                    th:selected="${genre.id == book.genreId}"
                    th:text="${genre.name}">Genre</option>
        </select>
    </label><br><br>
    <button type="submit">Save</button>
</form><br>
<a href="list.html" th:href="@{/books}"><button type="button">To Book List</button></a>
<div th:if="${errors}">
    <p style="color: red" th:each="error : ${errors}" th:text="|${error.field} ${error.defaultMessage}|">Error message</p>
</div>
</body>
</html>
