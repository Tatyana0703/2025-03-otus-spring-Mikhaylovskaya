<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User registration</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<form th:action="@{/users}" method="post" th:object="${user}">
    <label for="username">Username:
        <input id="username" type="text" name="username" th:value="*{username}">
    </label><br>
    <label for="rawPassword">Password:
        <input id="rawPassword" type="password" name="rawPassword">
    </label><br>
    <label for="role">Role:
        <select id="role" th:field="*{roleIds}" multiple="multiple">
            <option th:each="role : ${roles}"
                    th:value="${{role.id}}"
                    th:selected="${user.roleIds != null and #lists.contains(roleIds, role.id)}"
                    th:text="${role.name}">Role</option>
        </select>
    </label><br><br>
    <button type="submit">Register</button>
</form>
<div th:if="${errors}">
    <p style="color: red" th:each="error : ${errors}" th:text="|${error.field} ${error.defaultMessage}|">Error message</p>
</div>
</body>
</html>
